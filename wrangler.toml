name = "depublius"
main = "src/index.ts"
compatibility_date = "2026-05-02"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "depublius"
database_id = "e5b22010-c7df-4b2a-8b2b-b099c589b799"
migrations_dir = "./migrations"

# Local dev: Miniflare only accepts period: 10 or 60. Use 60s (5 req/min)
# locally so the dev server starts. Production override below uses 3600s
# (5 req/hour), which the deployed Workers runtime accepts. Deploy with
# `wrangler deploy --env production` (the npm `deploy` script does this).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[vars]
DAILY_BUDGET_CENTS = "500"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"  # test key for dev; replace via vars.production for deploy

[env.production.vars]
DAILY_BUDGET_CENTS = "2500"
TURNSTILE_SITE_KEY = "0x4AAAAAADHupTNuQbIHdDjr"

# Wrangler 3+ does not inherit bindings into env blocks — d1_databases must
# be redeclared. database_id matches the same depublius D1 database.
[[env.production.d1_databases]]
binding = "DB"
database_name = "depublius"
database_id = "e5b22010-c7df-4b2a-8b2b-b099c589b799"
migrations_dir = "./migrations"

[[env.production.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 3600 }  # 5 requests per IP per hour

[observability]
[observability.logs]
enabled = false
invocation_logs = true
